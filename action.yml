name: RLS Saboteur
description: Break each Postgres/Supabase RLS policy on purpose and fail the build when the tests do not notice.
author: Matt Muller
branding:
  icon: shield
  color: purple

inputs:
  threshold:
    description: Fail when the score is below this percentage.
    default: '100'
  working-directory:
    description: Directory that holds the supabase/ folder.
    default: '.'
  start-supabase:
    description: Run `supabase start` first. Set to false if an earlier step already started the stack.
    default: 'true'
  supabase-exclude:
    description: Containers `supabase start` should skip. The database alone is enough for pgTAP.
    default: 'gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor'
  test:
    description: Custom test command. Default is `supabase test db`.
    default: ''
  schemas:
    description: Comma-separated schemas to cover.
    default: 'public'
  jobs:
    description: Breaks to run in parallel.
    default: '2'
  version:
    description: >
      Version of the rls-saboteur npm package to run. The default is the version this
      release of the action ships with. The release step must keep it equal to package.json.
    default: '0.2.1'
  close-sessions:
    description: >
      Approve closing other sessions on the CI database for a moment, to take the first copy
      (passes --close-sessions). Empty (the default) means true when start-supabase is true, because
      the Action then starts its own throwaway database stack and nothing else uses it, and false
      otherwise, because the database is then yours. Set true or false to override. --yes does not approve this.
    default: ''
  extra-args:
    description: Extra command-line options for rls-saboteur.
    default: ''

outputs:
  score:
    description: The score as a percentage.
    value: ${{ steps.run.outputs.score }}
  missed:
    description: Number of missed breaks.
    value: ${{ steps.run.outputs.missed }}

runs:
  using: composite
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        SABOTEUR_START: ${{ inputs.start-supabase }}
        SABOTEUR_THRESHOLD: ${{ inputs.threshold }}
        SABOTEUR_JOBS: ${{ inputs.jobs }}
        SABOTEUR_VERSION: ${{ inputs.version }}
        SABOTEUR_CLOSE: ${{ inputs.close-sessions }}
      run: |
        fail() { echo "::error::$1"; exit 2; }
        [[ "$SABOTEUR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must look like 0.2.0, got: $SABOTEUR_VERSION"
        [[ "$SABOTEUR_THRESHOLD" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk -v t="$SABOTEUR_THRESHOLD" 'BEGIN { exit !(t >= 0 && t <= 100) }' || fail "threshold must be a number from 0 to 100, got: $SABOTEUR_THRESHOLD"
        [[ "$SABOTEUR_JOBS" =~ ^[1-9][0-9]*$ ]] || fail "jobs must be a whole number of 1 or more, got: $SABOTEUR_JOBS"
        [[ "$SABOTEUR_CLOSE" == "" || "$SABOTEUR_CLOSE" == "true" || "$SABOTEUR_CLOSE" == "false" ]] || fail "close-sessions must be true or false, got: $SABOTEUR_CLOSE"
        # Unset: close sessions only on the throwaway stack this Action starts itself.
        if [ -z "$SABOTEUR_CLOSE" ]; then
          if [ "$SABOTEUR_START" = "true" ]; then SABOTEUR_CLOSE=true; else SABOTEUR_CLOSE=false; fi
        fi
        echo "close=$SABOTEUR_CLOSE" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: '2.117.0'

    - name: Start local Supabase
      if: ${{ inputs.start-supabase == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SABOTEUR_EXCLUDE: ${{ inputs.supabase-exclude }}
      run: supabase start -x "$SABOTEUR_EXCLUDE"

    - name: Run RLS Saboteur
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SABOTEUR_THRESHOLD: ${{ inputs.threshold }}
        SABOTEUR_TEST: ${{ inputs.test }}
        SABOTEUR_SCHEMAS: ${{ inputs.schemas }}
        SABOTEUR_JOBS: ${{ inputs.jobs }}
        SABOTEUR_VERSION: ${{ inputs.version }}
        SABOTEUR_CLOSE: ${{ steps.check.outputs.close }}
        SABOTEUR_EXTRA: ${{ inputs.extra-args }}
      run: |
        # --yes: a CI run has no terminal. The workflow file is the user's own approval of the plan.
        # Closing sessions is a separate approval (--yes does not give it): the close-sessions input.
        args=(--threshold "$SABOTEUR_THRESHOLD" --schemas "$SABOTEUR_SCHEMAS" --jobs "$SABOTEUR_JOBS" --json-file saboteur-report.json --yes)
        if [ "$SABOTEUR_CLOSE" = "true" ]; then args+=(--close-sessions); fi
        if [ -n "$SABOTEUR_TEST" ]; then args+=(--test "$SABOTEUR_TEST"); fi
        read -r -a extra <<< "$SABOTEUR_EXTRA"
        set +e
        npx --yes "rls-saboteur@${SABOTEUR_VERSION}" "${args[@]}" "${extra[@]}"
        code=$?
        set -e
        if [ -f saboteur-report.json ]; then
          echo "score=$(node -p "JSON.parse(require('fs').readFileSync('saboteur-report.json','utf8')).score.percent")" >> "$GITHUB_OUTPUT"
          echo "missed=$(node -p "JSON.parse(require('fs').readFileSync('saboteur-report.json','utf8')).score.missed")" >> "$GITHUB_OUTPUT"
        fi
        if [ -f saboteur-report.md ]; then cat saboteur-report.md >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code

    - name: Upload report
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rls-saboteur-report
        path: |
          ${{ inputs.working-directory }}/saboteur-report.md
          ${{ inputs.working-directory }}/saboteur-report.json
        if-no-files-found: ignore
